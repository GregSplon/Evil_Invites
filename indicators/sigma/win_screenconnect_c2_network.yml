title: Outbound Connection to Observed ScreenConnect RAT Tenant Infrastructure
id: sc-campaign-0003
status: experimental
description: >
  Detects outbound TLS connections from endpoints to ScreenConnect web/relay
  infrastructure observed in this campaign. The observed tenant and relay names
  are campaign-specific indicators. Do not suppress matches merely because the
  initiating binary is a legitimate ScreenConnect client; the malicious activity
  abuses that legitimate client.
references:
  - https://jeanies-journeys.screenconnect.com/
  - https://ieee2.screenconnect.com/
author: defensive research
date: 2026/09/04
tags:
  - attack.command_and_control
  - attack.t1219
logsource:
  category: network_connection
  product: windows
detection:
  selection_tenant_domains:
    DestinationHostname|endswith:
      - 'jeanies-journeys.screenconnect.com'
      - 'ieee2.screenconnect.com'
      - 'instance-s7gewk-relay.screenconnect.com'
      - 'instance-ifkw0e-relay.screenconnect.com'
  selection_tenant_ips:
    DestinationIp:
      - '148.113.219.237'
      - '15.235.110.92'
      - '40.160.1.134'
      - '15.204.129.194'
  condition: 1 of selection_*
fields:
  - Image
  - DestinationIp
  - DestinationHostname
  - User
falsepositives:
  - A legitimate organization intentionally using one of these exact observed tenants or relay endpoints. Verify ownership before suppressing.
level: high
