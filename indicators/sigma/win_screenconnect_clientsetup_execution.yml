title: ScreenConnect ClientSetup Execution
id: sc-campaign-0001
status: experimental
description: >
  Detects execution of ScreenConnect.ClientSetup.exe/.msi, the installer used
  by this campaign to enroll victims into attacker ScreenConnect tenants.
  Combine with an allowlist of sanctioned MSP installer paths/hashes.
references:
  - https://jeanies-journeys.screenconnect.com/Bin/ScreenConnect.ClientSetup.exe?e=Access&y=Guest
  - https://ieee2.screenconnect.com/Bin/ScreenConnect.ClientSetup.exe?e=Access&y=Guest
author: defensive research
date: 2026/09/04
tags:
  - attack.defense_evasion
  - attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    Image|endswith:
      - '\ScreenConnect.ClientSetup.exe'
      - '\ScreenConnect.ClientSetup.msi'
  selection_cmdline:
    CommandLine|contains|all:
      - 'ClientSetup'
      - 'screenconnect'
  condition: selection_name or selection_cmdline
falsepositives:
  - Legitimate MSP remote-support deployments of ScreenConnect
  - ConnectWise technician installations
level: high
